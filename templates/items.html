<!DOCTYPE html>
<head>
    {% include 'partial_head.html' %}
    <title>Price Alerts - OSRS</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/2.3.6/css/dataTables.dataTables.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/columncontrol/1.2.0/css/columnControl.dataTables.css">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/items.css') }}">
</head>
<body>
    <div class="container">
        <header><h1>OSRS Price <span style="color: var(--primary);">Alerts</span></h1></header>
        <div class="table-wrapper">
            <table id="alertsTable" class="display nowrap cell-border" style="width:100%">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Icon</th>
                        <th>Name</th>
                        <th>Limit</th>
                        <th>Buy Price</th>
                        <th>Sell Price</th>
                        <th>Tax</th>
                        <th>Margin</th>
                        <th>Potential Profit</th>
                        <th>ROI (Flip)</th>
                        <th>Sell Vol</th>
                        <th>Buy Vol</th>
                        <th>Total Vol</th>
                        <th>Alch Profit</th>
                        <th>ROI (Alch)</th>
                        <th>24h Change</th>
                        <th>24h Avg High</th>
                        <th>High Alch</th>
                        <th>Low Alch</th>
                        <th>Cost (Instant)</th>
                        <th>Cost (Slow)</th>
                        <th>Store Value</th>
                        <th>Last Update</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://cdn.datatables.net/2.3.6/js/dataTables.js"></script>
    <script src="https://cdn.datatables.net/columncontrol/1.2.0/js/dataTables.columnControl.js"></script>
    <script src="{{ url_for('static', path='/js/items.js') }}"></script>

</body>
</html>
